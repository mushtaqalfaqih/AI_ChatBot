<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - AI ChatBot</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 10;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: var(--primary-hover);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .stat-card {
            padding: 1.5rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: center;
        }
        .stat-card h3 {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }
        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-main);
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }
        @media(max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
        .chart-card {
            padding: 1.5rem;
            border-radius: 1rem;
        }
        .chart-card h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-main);
        }
        .errors-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .errors-list li {
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .errors-list li:last-child {
            border-bottom: none;
        }
        .errors-list li span.count {
            background: rgba(255,50,50,0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 0.5rem;
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="background-mesh"></div>
    
    <div class="dashboard-container">
        <div class="header">
            <h1 style="color: var(--text-main); margin: 0;">لوحة التحكم التحليلية 📊</h1>
            <a href="/" class="back-btn">العودة للمحادثة</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <h3>إجمالي الرسائل</h3>
                <div class="value" id="valMessages">0</div>
            </div>
            <div class="stat-card glass-panel">
                <h3>متوسط زمن الاستجابة</h3>
                <div class="value" id="valLatency">0ms</div>
            </div>
            <div class="stat-card glass-panel">
                <h3>الملفات المرفوعة</h3>
                <div class="value" id="valUploads">0</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card glass-panel">
                <h3>نشاط الرسائل (آخر 7 أيام)</h3>
                <canvas id="messagesChart"></canvas>
            </div>
            <div class="chart-card glass-panel">
                <h3>توزيع مزودي الذكاء الاصطناعي</h3>
                <canvas id="providersChart"></canvas>
            </div>
        </div>

        <div class="chart-card glass-panel" style="margin-top: 1.5rem;">
            <h3>أكثر الأخطاء تكراراً ⚠️</h3>
            <ul class="errors-list" id="errorsList">
                <li>جاري التحميل...</li>
            </ul>
        </div>
    </div>

    <script>
        Chart.defaults.color = '#e2e8f0';
        Chart.defaults.font.family = 'Tajawal';

        async function loadAnalytics() {
            try {
                const res = await fetch('/api/analytics');
                const data = await res.json();

                document.getElementById('valMessages').textContent = data.total_messages || 0;
                document.getElementById('valLatency').textContent = (data.avg_response_time || 0) + 'ms';
                document.getElementById('valUploads').textContent = data.total_uploads || 0;

                // Render Errors
                const errorsList = document.getElementById('errorsList');
                errorsList.innerHTML = '';
                if(data.top_errors && data.top_errors.length > 0) {
                    data.top_errors.forEach(e => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>${e.error}</span><span class="count">${e.count}</span>`;
                        errorsList.appendChild(li);
                    });
                } else {
                    errorsList.innerHTML = '<li>لا توجد أخطاء مسجلة 🥳</li>';
                }

                // Render Messages Chart
                const msgCtx = document.getElementById('messagesChart').getContext('2d');
                const dates = Object.keys(data.daily_messages || {});
                const counts = Object.values(data.daily_messages || {});
                
                // Ensure at least some data for empty state
                if (dates.length === 0) {
                    const today = new Date().toISOString().split('T')[0];
                    dates.push(today);
                    counts.push(0);
                }

                new Chart(msgCtx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'الرسائل',
                            data: counts,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

                // Render Providers Chart
                const provCtx = document.getElementById('providersChart').getContext('2d');
                const providers = Object.keys(data.providers_usage || {});
                const provCounts = Object.values(data.providers_usage || {});
                
                if (providers.length === 0) {
                    providers.push('لا توجد بيانات');
                    provCounts.push(1);
                }

                new Chart(provCtx, {
                    type: 'doughnut',
                    data: {
                        labels: providers,
                        datasets: [{
                            data: provCounts,
                            backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#64748b'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

            } catch(e) {
                console.error(e);
                document.getElementById('errorsList').innerHTML = '<li>فشل في جلب البيانات</li>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadAnalytics);
    </script>
</body>
</html>
